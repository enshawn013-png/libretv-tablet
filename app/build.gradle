plugins {
    id 'com.android.application'
}

android {
    namespace 'com.herl.libretv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.herl.libretv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            // 直接出可安装的 debug APK（未签名正式包需要 keystore，这里走 debug 签名）
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 故意不依赖 AndroidX / AppCompat：这个壳只用系统 API，
    // 少一层依赖就少一处「启动即崩」的可能（第一版就是栽在这上面）
}
