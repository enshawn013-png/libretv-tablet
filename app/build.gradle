plugins {
    id 'com.android.application'
}

android {
    namespace 'com.herl.libretv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.herl.libretv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            // 直接出可安装的 debug APK（未签名正式包需要 keystore，这里走 debug 签名）
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
